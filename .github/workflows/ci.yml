name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install optional Linux probe dependency
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Run ARM64 release smoke workload
        run: ./scripts/arm64_smoke.sh 2>&1 | tee arm64-final-benchmarks.log

      - name: Upload ARM64 benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easy-uds-arm64-final-benchmarks
          path: arm64-final-benchmarks.log

  native-linux-benchmarks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install optional Linux probe dependency
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Configure final benchmark build
        run: >-
          cmake -S . -B build-final
          -DCMAKE_BUILD_TYPE=Release
          -DEASY_UDS_BUILD_BENCHMARKS=ON
          -DEASY_UDS_BUILD_EXPERIMENTS=ON
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON

      - name: Build final benchmark targets
        run: cmake --build build-final --parallel

      - name: Run native Linux final benchmarks
        run: ./scripts/final_linux_benchmarks.sh build-final 2>&1 | tee x86_64-final-benchmarks.log

      - name: Run repeated unit and stress soak
        run: ./scripts/long_soak.sh build-final 20 2>&1 | tee -a x86_64-final-benchmarks.log

      - name: Upload x86_64 benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easy-uds-x86_64-final-benchmarks
          path: x86_64-final-benchmarks.log

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        shared: [OFF, ON]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DEASY_UDS_BUILD_BENCHMARKS=ON
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  compile-error-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Compile invalid-usage probes and expect readable failures
        run: bash scripts/compile_error_smoke.sh

  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install optional Linux probe dependency
        run: sudo apt-get update && sudo apt-get install -y liburing-dev

      - name: Configure standalone probes
        run: >-
          cmake -S . -B build-experiments
          -DCMAKE_BUILD_TYPE=Release
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_BUILD_TESTS=OFF
          -DEASY_UDS_BUILD_BENCHMARKS=ON
          -DEASY_UDS_BUILD_EXPERIMENTS=ON
          -DEASY_UDS_TRACE_SPIN_MISS=ON
          -DEASY_UDS_TRACE_SESSION_CONTENTION=ON
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON

      - name: Build standalone probes
        run: cmake --build build-experiments --parallel

      - name: Run portable probes
        run: |
          ./build-experiments/easy_uds_fd_passing_probe
          ./build-experiments/easy_uds_false_sharing_probe 100000
          ./build-experiments/easy_uds_zero_copy_probe 1048576
          ./build-experiments/easy_uds_shm_transport_probe 4096 1000
          ./build-experiments/easy_uds_shm_framed_probe 4096 200
          ./build-experiments/easy_uds_shm_process_probe 4096 200
          ./build-experiments/easy_uds_session_benchmark 200 4 shared 0

      - name: Run io_uring probe when the runner permits it
        run: |
          ./build-experiments/easy_uds_io_uring_probe
          if ./build-experiments/easy_uds_io_uring_probe | grep -q 'supported'; then
            ./build-experiments/easy_uds_io_uring_echo_probe 2 2000
          else
            echo 'io_uring unavailable in this runner; echo probe skipped'
          fi

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure TSan
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure

  protocol-fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure libFuzzer target
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_BUILD_TESTS=OFF
          -DEASY_UDS_BUILD_FUZZERS=ON

      - name: Build fuzzer
        run: cmake --build build-fuzz --target easy_uds_protocol_fuzz --parallel

      - name: Run bounded fuzz smoke test
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            runs=200000
          else
            runs=20000
          fi
          mkdir -p fuzz-corpus
          ./build-fuzz/easy_uds_protocol_fuzz fuzz-corpus -runs="$runs" -max_len=64

      - name: Build session fuzzer
        run: cmake --build build-fuzz --target easy_uds_session_fuzz --parallel

      - name: Run bounded session fuzz smoke test
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            runs=20000
          else
            runs=2000
          fi
          mkdir -p session-fuzz-corpus
          ./build-fuzz/easy_uds_session_fuzz session-fuzz-corpus -runs="$runs" -max_len=256

  install-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shared: [OFF, ON]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and install library
        run: |
          cmake -S . -B build-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DEASY_UDS_BUILD_EXAMPLES=OFF \
            -DEASY_UDS_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build build-install --parallel
          cmake --install build-install

      - name: Build find_package consumer
        run: |
          cmake -S tests/package_consumer -B consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build consumer-build --parallel
          ./consumer-build/easy_uds_package_consumer

      - name: Build beginner find_package consumer
        run: |
          cmake -S tests/beginner -B beginner-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build beginner-build --parallel

      - name: Run beginner package consumer against a real server
        run: |
          bash scripts/beginner_consumer_smoke.sh \
            beginner-build "$RUNNER_TEMP/easy-uds-beginner.sock"

      - name: Build installed Simple API consumer
        run: |
          cmake -S tests/simple_consumer -B simple-consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build simple-consumer-build --parallel

      - name: Run installed Simple API consumer
        run: |
          bash scripts/simple_consumer_smoke.sh \
            simple-consumer-build "$RUNNER_TEMP/easy-uds-simple.sock"

  release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run one-command 0.7 release-candidate gate
        run: bash scripts/release_gate.sh "$RUNNER_TEMP/easy-uds-release-gate"

  simple-api-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure Simple API experiment
        run: >-
          cmake -S . -B build-simple
          -DCMAKE_BUILD_TYPE=Release
          -DEASY_UDS_BUILD_SIMPLE_EXPERIMENTS=ON
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON

      - name: Build Simple API experiment
        run: cmake --build build-simple --parallel

      - name: Run Simple API syntax and diagnostic probes
        run: ctest --test-dir build-simple -L simple --output-on-failure

      - name: Run Simple/Core A-B and allocation probes
        run: bash scripts/simple_core_benchmark_median.sh build-simple 5000 5
