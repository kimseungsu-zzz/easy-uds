name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run ARM64 release smoke workload
        run: ./scripts/arm64_smoke.sh

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        shared: [OFF, ON]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DEASY_UDS_BUILD_BENCHMARKS=ON
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure ASan and UBSan
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure TSan
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure

  protocol-fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure libFuzzer target
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DEASY_UDS_BUILD_EXAMPLES=OFF
          -DEASY_UDS_BUILD_TESTS=OFF
          -DEASY_UDS_BUILD_FUZZERS=ON

      - name: Build fuzzer
        run: cmake --build build-fuzz --target easy_uds_protocol_fuzz --parallel

      - name: Run bounded fuzz smoke test
        run: |
          mkdir -p fuzz-corpus
          ./build-fuzz/easy_uds_protocol_fuzz fuzz-corpus -runs=20000 -max_len=64

      - name: Build session fuzzer
        run: cmake --build build-fuzz --target easy_uds_session_fuzz --parallel

      - name: Run bounded session fuzz smoke test
        run: |
          mkdir -p session-fuzz-corpus
          ./build-fuzz/easy_uds_session_fuzz session-fuzz-corpus -runs=2000 -max_len=256

  install-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shared: [OFF, ON]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and install library
        run: |
          cmake -S . -B build-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DEASY_UDS_BUILD_EXAMPLES=OFF \
            -DEASY_UDS_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build build-install --parallel
          cmake --install build-install

      - name: Build find_package consumer
        run: |
          cmake -S tests/package_consumer -B consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/easy-uds-prefix"
          cmake --build consumer-build --parallel
          ./consumer-build/easy_uds_package_consumer
