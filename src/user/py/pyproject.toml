[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-uds"
version = "1.1.0"
description = "Python ctypes binding for the easy-uds local IPC library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kimseungsu-dev" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
keywords = ["unix-domain-socket", "ipc", "rpc", "ctypes"]

[project.urls]
Homepage = "https://github.com/kimseungsu-zzz/easy-uds"
Repository = "https://github.com/kimseungsu-zzz/easy-uds"
Issues = "https://github.com/kimseungsu-zzz/easy-uds/issues"

[tool.setuptools]
packages = ["easy_uds"]
